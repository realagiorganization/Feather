name: Validate TestFlight Release

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: macos-15
    env:
      APP_IDENTIFIER: ${{ secrets.APP_IDENTIFIER }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      FEATHER_SCHEME: ${{ secrets.FEATHER_SCHEME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install bundler dependencies
        run: bundle install

      - name: Run BDD suite
        run: python3 scripts/run_bdd.py

      - name: Dry-run TestFlight build & upload
        env:
          DELIVER_ITMSTRANSPORTER_ADDITIONAL_UPLOAD_PARAMETERS: "-DryRun"
        run: bundle exec fastlane testflight
